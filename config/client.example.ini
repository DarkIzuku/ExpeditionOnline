[network]
; Dirección del equipo que ejecuta ExpeditionOnlineServer.
ServerHost=127.0.0.1
ServerPort=7777
PlayerName=Expeditioner
reconnect_delay_ms=2000
snapshot_hz=15
; 100-150 ms para dos clientes reales a 15 Hz. Usa 300 ms al probar
; contra ExpeditionOnlineProbe a 4 Hz.
interpolation_delay_ms=100
heartbeat_interval_seconds=5
server_timeout_seconds=15

[game]
; Nombres validados en Clair Obscur: Expedition 33. Body tiene prioridad; tras
; un cambio de skin, Pawn.Mesh puede apuntar al componente dinámico real.
controller_class=BP_jRPG_Controller_World_C
world_map_controller_class=BP_PlayerController_WorldMap_C
pawn_property=Pawn
body_component_property=Body
hair_component_property=Haircut_SkeletalMesh
mesh_asset_property=SkeletalMesh
controller_property=Controller
brain_component_property=BrainComponent

; Experimental: la interpolación de red conserva la autoridad posicional y
; desactiva únicamente el tick de CharacterMovement del actor remoto.
remote_network_authority=true
remote_use_movement_input=false

; Backend normal independiente y actor específico para el mapa mundial.
remote_actor_mode=world_character
fallback_ai_companion=true
world_character_class=/Game/jRPGTemplate/Blueprints/Basics/BP_jRPG_Character_World.BP_jRPG_Character_World_C
world_map_character_class=/Game/Gameplay/WorldMap/BP_WorldMapCharacter.BP_WorldMapCharacter_C
world_map_remote=true
teleport_threshold_units=5000

; Estados discretos enviados solo al cambiar. Todas las UFunctions vanilla se
; validan por reflection antes de invocarse y fallan sin romper el avatar.
vanilla_customization=true
sync_locomotion_state=true
sync_gait=true
sync_crouch=true
sync_aim=true

; Diagnosticos costosos/descriptivos. Permanecen apagados en el backend normal.
legacy_visual_diagnostics=false
rotation_diagnostics=false

; Crash-safe por defecto. Actívalos solo para pruebas controladas: las
; escrituras directas de meshes anteriores llegaron a aplicarse y luego crashearon.
unsafe_direct_appearance=false
unsafe_direct_hair=false

; Solo se usa si remote_actor_mode=ai_companion_legacy o si el backend normal
; no está disponible y fallback_ai_companion=true.
default_companion_class=BP_Pawn_AICompanion_Maelle_C

[companions]
; Mappings exclusivos del fallback AI companion legacy.
Maelle=BP_Pawn_AICompanion_Maelle_C
Verso=BP_Pawn_AICompanion_Verso_C
Sciel=BP_Pawn_AICompanion_Sciel_C
