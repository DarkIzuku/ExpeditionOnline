[network]
; Dirección del equipo que ejecuta ExpeditionOnlineServer.
ServerHost=127.0.0.1
ServerPort=7777
PlayerName=Expeditioner
reconnect_delay_ms=2000
snapshot_hz=15

[game]
; Nombres validados en Clair Obscur: Expedition 33. El cuerpo local se obtiene
; primero mediante Pawn.Mesh y se valida como SkeletalMeshComponent; estos
; nombres se usan para la búsqueda owned-component de respaldo y para remotos.
controller_class=BP_jRPG_Controller_World_C
pawn_property=Pawn
body_component_property=Body
hair_component_property=Haircut_SkeletalMesh
mesh_asset_property=SkeletalMesh
controller_property=Controller
brain_component_property=BrainComponent

; Puede ser el nombre corto de una clase que ya tenga una instancia cargada,
; o una ruta completa /Game/.../BP_Clase.BP_Clase_C.
default_companion_class=BP_Pawn_AICompanion_Maelle_C

[companions]
; La clave puede ser una clase exacta o un token presente en Character/Outfit/Hair.
Maelle=BP_Pawn_AICompanion_Maelle_C
Verso=BP_Pawn_AICompanion_Verso_C
Sciel=BP_Pawn_AICompanion_Sciel_C
